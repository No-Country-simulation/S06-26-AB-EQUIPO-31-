<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App BiT</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>App BiT</h1>
      <p>Formação, empregabilidade, mentorias, experiências e saúde mental em um só lugar.</p>
    </header>

    <main class="container">
      <section class="card">
        <h2>Onboarding + Orientação</h2>
        <form id="orientar-form">
          <div class="grid">
            <label>Usuário ID <input name="usuario_id" required /></label>
            <label>Perfil <input name="perfil" required placeholder="estudante, graduado..." /></label>
            <label>Nível <input name="nivel" required placeholder="junior, pleno..." /></label>
            <label>Região <input name="regiao" required placeholder="Brasil/SP/São Paulo" /></label>
            <label>Idioma <input name="idioma" required value="pt-BR" /></label>
            <label>Latitude <input type="number" step="any" name="lat" required /></label>
            <label>Longitude <input type="number" step="any" name="lng" required /></label>
          </div>
          <button type="submit">Gerar orientação</button>
        </form>
      </section>

      <section class="card">
        <h2>Resultado</h2>
        <pre id="output">Preencha o formulário para ver o resultado do /orientar.</pre>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
